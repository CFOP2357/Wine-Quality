[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "wine_quality"
version = "0.0.1"
description = "Wine Quality experimentation with MLflow"
authors = [
  { name = "Yoguel Salazar" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["wine_quality"]
include = ["pyproject.toml", "wine_quality/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["wine_quality"]
force-sort-within-sections = true

